name: Deploy isolated Val3ntino test Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: val3ntino-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/val3ntino-paypal-hardening'
    runs-on: ubuntu-latest
    environment: cloudflare-test
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check && npm run test:paypal && npm run test:portal && npm test
      - name: Verify staging target and credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN_TEST"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          grep -q '^name = "valentinolopez-api-test"$' wrangler.test.toml
          grep -q '^TEST_MODE = "true"$' wrangler.test.toml
          ! grep -q '\[\[kv_namespaces\]\]' wrangler.test.toml
      - name: Deploy test Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.test.toml
