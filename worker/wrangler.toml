# Cloudflare Worker für valentinolopez.de (Free Plan)
name = "valentinolopez-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Alle 5 Minuten offene Krypto-Bestellungen nachprüfen / nach 30 Min. ablaufen lassen
[triggers]
crons = ["*/5 * * * *"]

# Öffentliche Konfiguration (keine Geheimnisse hier!)
[vars]
FIREBASE_PROJECT_ID = "valentinolopezde"
MERCHANT_WALLET = "5fzfBAiPfJ8y6s9jCBbypsVLNFUd9rLVEQHzewdHcxBD"
PAYPAL_ENV = "sandbox"          # "sandbox" oder "live"
PAYPAL_CLIENT_ID = ""           # öffentliche PayPal-Client-ID (muss zur client-id im HTML passen)
ALLOWED_ORIGINS = "https://valentinolopez.de,https://www.valentinolopez.de,http://localhost:8788,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
SMTP_ENABLED = "false"          # E-Mail-Versand ist auf Workers nicht eingebaut (siehe README)

# Geheimnisse (NICHT hier eintragen) – per:
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT   (kompletter JSON-Inhalt des Dienstkonto-Schlüssels)
#   npx wrangler secret put PAYPAL_CLIENT_SECRET
#   optional: npx wrangler secret put SOLANA_RPC_URL  (eigener RPC, z. B. Helius Free; Standard: api.mainnet-beta.solana.com)
